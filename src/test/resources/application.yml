# Replaces src/main/resources/application.yml during the tests — it does NOT
# merge with it, so every property a test needs has to be repeated here
# (confirmed the hard way in bank-spike's step 0.6).
spring:
  application:
    name: customer-service
  cloud:
    config:
      enabled: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/bank_customer?directConnection=true

bank:
  zone: America/Lima
